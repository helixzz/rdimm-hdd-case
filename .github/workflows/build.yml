name: Build and verify geometry

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python src/build_v1.py --output-dir build/v1
      - run: python src/build_case.py --output-dir build/v2
      - run: python src/layout_v2.py --models build/v2 --output-dir build/plates-v2
      - run: python src/build_retention.py --models build/v2 --output-dir build/v2-retention
      - run: python src/build_v3.py --models build/v2-retention --output-dir build/v3
      - run: python src/build_simple_trays.py --models build/v2-retention --v3-models build/v3 --output-dir build/v3-simple
      - run: python src/build_v3_1.py --models build/v2-retention --v3-models build/v3 --output-dir build/v3.1
      - run: python src/build_v3_2.py --output-dir build/v3.2-rc1
      - run: python src/build_latch_check_rc2.py --output-dir build/v3.2-rc2-latch-check
      - run: python src/build_v4.py --output-dir build/v4.0-rc1
      - run: python src/build_v4_rc2.py --output-dir build/v4.0-rc2
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: rdimm-case-${{ matrix.os }}
          path: build/
          if-no-files-found: error
