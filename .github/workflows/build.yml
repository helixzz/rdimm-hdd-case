name: Build and verify geometry

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python src/build_v1.py --output-dir build/v1
      - run: python src/build_case.py --output-dir build/v2
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: rdimm-case-${{ matrix.os }}
          path: build/
          if-no-files-found: error
